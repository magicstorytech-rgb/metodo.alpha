<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard TRIPE - Ultra Analytics v10.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #e5e7eb; }
        .glass { background: rgba(17, 17, 17, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .card-stat { transition: transform 0.2s; }
        .card-stat:hover { transform: translateY(-4px); }
        .step-dot { width: 8px; height: 8px; border-radius: 50%; background: #222; transition: all 0.3s; }
        .step-dot.active { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
        .status-badge { font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; }
        .status-vsl { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
        .status-quiz { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .status-checkout { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-extrabold tracking-tighter text-white">ANALYTICS <span class="text-red-500">V10.7</span></h1>
                <p class="text-gray-500 text-sm">Monitoramento e Filtro de Visão em Tempo Real</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="location.reload()" class="glass px-4 py-2 rounded-lg text-xs font-bold hover:bg-white/5 transition flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M3 21v-5h5"></path></svg>
                    RESETAR VISÃO
                </button>
                <div class="glass px-4 py-2 rounded-lg flex items-center gap-2">
                    <div class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></div>
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Online Agora: <span id="online-count" class="text-white">0</span></span>
                </div>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            <div class="lg:col-span-2 glass rounded-2xl p-6">
                <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-6 flex items-center gap-2">
                    <div class="w-1.5 h-1.5 bg-red-500 rounded-full"></div>
                    Acessos (Últimas 24h)
                </h3>
                <canvas id="chart24h" height="120"></canvas>
            </div>
            <div class="glass rounded-2xl p-6">
                <h3 class="text-sm font-bold text-yellow-500 uppercase tracking-wider mb-6 flex items-center gap-2">
                    <div class="w-1.5 h-1.5 bg-yellow-500 rounded-full"></div>
                    Retenção do Quiz
                </h3>
                <canvas id="quizRetentionChart" height="200"></canvas>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="glass rounded-2xl p-6 card-stat">
                <p class="text-gray-500 text-xs font-bold uppercase mb-1">Leads (Visão Atual)</p>
                <h2 class="text-3xl font-black text-white tracking-tighter" id="total-leads">0</h2>
            </div>
            <div class="glass rounded-2xl p-6 card-stat">
                <p class="text-gray-500 text-xs font-bold uppercase mb-1">Taxa de Conclusão</p>
                <h2 class="text-3xl font-black text-green-500 tracking-tighter" id="completion-rate">0%</h2>
            </div>
            <div class="glass rounded-2xl p-6 card-stat">
                <p class="text-gray-500 text-xs font-bold uppercase mb-1">Maior Abandono</p>
                <h2 class="text-3xl font-black text-red-500 tracking-tighter" id="top-dropoff">N/A</h2>
            </div>
        </div>

        <!-- Real-time Feed -->
        <div class="glass rounded-2xl p-6">
            <h3 class="text-sm font-bold text-green-500 uppercase tracking-wider mb-6 flex items-center gap-2">
                <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div>
                Espião de Fluxo (Tempo Real)
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4" id="live-feed">
                <!-- Live leads will be injected here -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCrUYYLb_9p4QUq1JLqQUwWEx-GgWEoTxQ",
            authDomain: "funil-tripe-v10.firebaseapp.com",
            databaseURL: "https://funil-tripe-v10-default-rtdb.firebaseio.com",
            projectId: "funil-tripe-v10",
            storageBucket: "funil-tripe-v10.firebasestorage.app",
            messagingSenderId: "872809369468",
            appId: "1:872809369468:web:e372a48b9654739098def9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const sessionsRef = ref(db, 'sessions');

        let retentionChart, accessChart;

        function initCharts() {
            const ctxRetention = document.getElementById('quizRetentionChart').getContext('2d');
            retentionChart = new Chart(ctxRetention, {
                type: 'bar',
                data: {
                    labels: Array.from({length: 15}, (_, i) => `Q${i+1}`),
                    datasets: [{
                        label: 'Utilizadores',
                        data: new Array(15).fill(0),
                        backgroundColor: '#ef4444',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#222' }, ticks: { color: '#555' } },
                        x: { grid: { display: false }, ticks: { color: '#555' } }
                    }
                }
            });

            const ctxAccess = document.getElementById('chart24h').getContext('2d');
            accessChart = new Chart(ctxAccess, {
                type: 'line',
                data: {
                    labels: Array.from({length: 24}, (_, i) => `${i}:00`),
                    datasets: [{
                        data: new Array(24).fill(0).map(() => Math.floor(Math.random() * 50)),
                        borderColor: '#ef4444',
                        tension: 0.4,
                        fill: true,
                        backgroundColor: 'rgba(239, 68, 68, 0.1)',
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { display: false },
                        x: { grid: { display: false }, ticks: { color: '#444' } }
                    }
                }
            });
        }

        onValue(sessionsRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const sessions = Object.values(data);
            const now = Date.now();
            
            // 1. Online Count (active in last 5 mins)
            const online = sessions.filter(s => (now - (s.enteredAt || 0)) < 300000).length;
            document.getElementById('online-count').innerText = online;

            // 2. Total Leads
            document.getElementById('total-leads').innerText = sessions.length;

            // 3. Retention Data
            const retention = new Array(15).fill(0);
            let checkouts = 0;
            let startedQuiz = 0;

            sessions.forEach(s => {
                if (s.currentStep > 0) {
                    startedQuiz++;
                    for (let i = 0; i < s.currentStep && i < 15; i++) {
                        retention[i]++;
                    }
                }
                if (s.status === 'checkout_clicked') checkouts++;
            });

            retentionChart.data.datasets[0].data = retention;
            retentionChart.update();

            // 4. Completion Rate
            const rate = startedQuiz > 0 ? ((checkouts / startedQuiz) * 100).toFixed(1) : 0;
            document.getElementById('completion-rate').innerText = `${rate}%`;

            // 5. Top Dropoff
            let maxDrop = 0;
            let dropStep = "N/A";
            for (let i = 0; i < 14; i++) {
                const drop = retention[i] - retention[i+1];
                if (drop > maxDrop) {
                    maxDrop = drop;
                    dropStep = `Q${i+1}`;
                }
            }
            document.getElementById('top-dropoff').innerText = dropStep;

            // 6. Live Feed
            const feed = document.getElementById('live-feed');
            const sortedSessions = sessions.sort((a, b) => (b.enteredAt || 0) - (a.enteredAt || 0)).slice(0, 12);
            
            feed.innerHTML = sortedSessions.map(s => {
                const timeAgo = Math.floor((now - (s.enteredAt || 0)) / 60000);
                let statusClass = "status-vsl";
                let statusText = s.status || "VSL VIEWED";
                
                if (s.status === 'checkout_clicked') {
                    statusClass = "status-checkout";
                    statusText = "🔥 NO CHECKOUT";
                } else if (s.currentStep > 0) {
                    statusClass = "status-quiz";
                    statusText = `QUIZ (${s.currentStep}/15)`;
                }

                return `
                    <div class="glass p-4 rounded-xl border-l-4 border-red-500/30">
                        <div class="flex justify-between items-start mb-2">
                            <span class="status-badge ${statusClass}">${statusText}</span>
                            <span class="text-[10px] text-gray-500 font-bold">${timeAgo} min atrás</span>
                        </div>
                        <div class="flex gap-1 mt-3">
                            <div class="step-dot ${s.status ? 'active' : ''}"></div>
                            <div class="h-[1px] flex-1 bg-white/10 self-center"></div>
                            <div class="step-dot ${s.currentStep > 0 ? 'active' : ''}"></div>
                            <div class="h-[1px] flex-1 bg-white/10 self-center"></div>
                            <div class="step-dot ${s.currentStep >= 15 ? 'active' : ''}"></div>
                            <div class="h-[1px] flex-1 bg-white/10 self-center"></div>
                            <div class="step-dot ${s.status === 'checkout_clicked' ? 'active' : ''}"></div>
                        </div>
                        <div class="flex justify-between text-[8px] text-gray-600 mt-1 font-black uppercase">
                            <span>VSL</span><span>MODAL</span><span>QUIZ</span><span>OFERTA</span>
                        </div>
                    </div>
                `;
            }).join('');
        });

        window.onload = initCharts;
    </script>
</body>
</html>
