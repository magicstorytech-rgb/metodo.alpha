<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Consulta Profissional - Protocolo TRIPE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ef4444; --bg: #050505; --card: #111111; --text: #ffffff; --muted: #9ca3af; --border: #262626; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .quiz-card { width: 100%; max-width: 550px; background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); text-align: center; }
        .fixed-header { font-size: 10px; font-weight: 900; color: var(--primary); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }
        .headline { font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 15px; line-height: 1.2; text-transform: uppercase; }
        .sub-headline { font-size: 14px; color: var(--primary); font-weight: 700; margin-bottom: 20px; }
        .video-container { position: relative; background: #000; border-radius: 16px; overflow: hidden; margin-bottom: 25px; border: 1px solid var(--border); width: 100%; }
        .btn-next { background: var(--primary); color: white; border: none; padding: 22px; border-radius: 14px; font-weight: 900; cursor: pointer; width: 100%; font-size: 20px; text-transform: uppercase; transition: all 0.3s; box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3); }
        .btn-next:hover { transform: scale(1.02); }
        .btn-next:disabled { background: #555; color: #999; cursor: not-allowed; box-shadow: none; }
        .screen { display: none; }
        .screen.active { display: block; }
        .progress-bar { height: 4px; background: var(--border); border-radius: 10px; margin-bottom: 30px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }
        .options-grid { display: grid; gap: 12px; margin-bottom: 25px; }
        .option-btn { background: var(--card); border: 2px solid var(--border); color: var(--text); padding: 16px; border-radius: 12px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .option-btn:hover { border-color: var(--primary); background: rgba(239, 68, 68, 0.1); }
        
        /* Popup de Desconto */
        .discount-popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            animation: fadeIn 0.3s ease;
        }
        .discount-popup-overlay.active { display: flex; align-items: center; justify-content: center; padding: 20px; }
        .discount-popup-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 2px solid #22c55e;
            border-radius: 24px;
            padding: 40px 30px 30px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            animation: slideUp 0.4s ease;
            box-shadow: 0 20px 60px rgba(34, 197, 94, 0.4);
        }
        .discount-icon { font-size: 56px; margin-bottom: 15px; }
        .discount-title { font-size: 24px; font-weight: 900; color: #22c55e; margin-bottom: 12px; text-transform: uppercase; }
        .discount-message { font-size: 15px; color: #e2e8f0; line-height: 1.6; margin-bottom: 20px; }
        .discount-image { width: 100%; max-height: 350px; object-fit: contain; border-radius: 12px; margin: 20px 0; border: 2px solid rgba(34, 197, 94, 0.5); }
        .discount-btn { border: none; padding: 18px 30px; border-radius: 14px; font-weight: 900; cursor: pointer; width: 100%; font-size: 16px; text-transform: uppercase; transition: all 0.3s; }
        .discount-btn.secondary { background: transparent; color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3); margin-top: 10px; }
    </style>
</head>
<body>
    <div class="quiz-card">
        <div id="s-0" class="screen active">
            <div class="fixed-header">PROTOCOLO TRIPE - REVELADO</div>
            <h1 class="headline">O SEGREDO DOS ATORES PÔRNO PARA ATIVAR O CRESCIMENTO DO PÊNIS EM 45 DIAS.</h1>
            <div class="video-container">
                <video width="100%" height="auto" controls poster="https://protocolotripe.online/wp-content/uploads/2026/01/ONTc4COn_thumb.jpg">
                    <source src="https://metodotripe.shop/wp-content/uploads/2026/01/%E3%85%A4%E3%85%A4%E3%85%A4%E3%85%A4%E3%85%A4%E3%85%A4%E3%85%A4%E3%85%A4%E3%85%A4%E3%85%A4%E3%85%A4%E3%85%A4%E3%85%A4%E3%85%A4%E3%85%A4%E3%85%A4.mp4" type="video/mp4">
                </video>
            </div>
            <button class="btn-next" onclick="next()">REVELAR O SEGREDO</button>
        </div>
        <div id="s-1" class="screen">
            <div class="fixed-header">AVALIAÇÃO GRATUITA</div>
            <p style="color: var(--muted); margin: 40px 0;" id="loading-text">Carregando avaliação...</p>
            <button id="start-quiz-btn" class="btn-next" onclick="next()" disabled>INICIAR MINHA AVALIAÇÃO</button>
        </div>
        <div id="s-2" class="screen">
            <div class="fixed-header">ETAPA <span id="q-num">1</span>/15</div>
            <div class="progress-bar"><div class="progress-fill" id="p-fill"></div></div>
            <div id="q-box"></div>
        </div>
        <div id="s-3" class="screen">
            <h2 class="headline">PROCESSANDO...</h2>
        </div>
        <div id="s-4" class="screen">
            <h2 class="headline">PLANO PRONTO!</h2>
            <button class="btn-next" onclick="finish()">GARANTIR ACESSO</button>
        </div>
    </div>

    <div class="discount-popup-overlay" id="discount-popup">
        <div class="discount-popup-content">
            <div class="discount-icon">🎁</div>
            <div class="discount-title">GANHE 40% DE DESCONTO</div>
            <div class="discount-message">Abra no navegador para economizar:</div>
            <img src="https://i.im.ge/2026/02/06/e0jl7p.WhatsApp-Image-2026-02-02-at-09-17-58-2-1-2.jpeg" class="discount-image">
            <button class="discount-btn secondary" onclick="continueWithoutDiscount()">Continuar no TikTok</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, doc, setDoc, updateDoc, serverTimestamp, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyB-GPkmK_iNQuu_96NsWBEmnZA1LhiSRR4",
            authDomain: "alytics-metodo-alpha.firebaseapp.com",
            projectId: "alytics-metodo-alpha",
            storageBucket: "alytics-metodo-alpha.firebasestorage.app",
            messagingSenderId: "389989039442",
            appId: "1:389989039442:web:e897945ffbfe52da210e8b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function getPersistentId() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlId = urlParams.get('sid');
            const localId = localStorage.getItem('tripe_sid');
            if (urlId) { localStorage.setItem('tripe_sid', urlId); return urlId; }
            if (localId) return localId;
            const newId = 's_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('tripe_sid', newId);
            return newId;
        }

        const sid = getPersistentId();
        let step = 0, qIdx = 0;

        async function trackEvent(eventName, data = {}) {
            try {
                await updateDoc(doc(db, 'sessions', sid), {
                    [`events.${eventName}`]: serverTimestamp(),
                    lastActivity: serverTimestamp(),
                    ...data
                });
            } catch (e) { console.error(e); }
        }

        window.next = async () => {
            if (step === 0) { step = 1; await trackEvent('vsl_clicked'); setTimeout(() => { document.getElementById('loading-text').style.display = 'none'; document.getElementById('start-quiz-btn').disabled = false; }, 2000); }
            else if (step === 1) { step = 2; await trackEvent('quiz_started'); }
            else if (step === 2) { 
                if (qIdx < 14) { qIdx++; await trackEvent('quiz_progress', { quizProgress: qIdx + 1 }); }
                else { step = 3; await trackEvent('quiz_completed'); setTimeout(() => { step = 4; render(); trackEvent('processing_completed'); }, 3000); } 
            }
            render();
        };

        window.finish = async () => { 
            await trackEvent('checkout_clicked'); 
            window.location.href = `https://pay.wiapy.com/elbyXqblP2?utm_source=${sid}&external_id=${sid}`; 
        };

        function render() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('s-' + step).classList.add('active');
            if (step === 2) {
                const q = { t: 'Pergunta ' + (qIdx+1), o: ['Opção A', 'Opção B'] };
                document.getElementById('q-num').innerText = qIdx + 1;
                document.getElementById('p-fill').style.width = ((qIdx + 1) / 15 * 100) + '%';
                document.getElementById('q-box').innerHTML = `<h2 class="headline">${q.t}</h2><div class="options-grid">${q.o.map(opt => `<button class="option-btn" onclick="next()">${opt}</button>`).join('')}</div>`;
            }
        }

        window.continueWithoutDiscount = async () => {
            document.getElementById('discount-popup').classList.remove('active');
            localStorage.setItem('discount_seen', 'true');
            await trackEvent('continued_on_tiktok'); // Rastreia quem ficou no TikTok
        };

        async function init() {
            const docSnap = await getDoc(doc(db, 'sessions', sid));
            const inApp = /FBAN|FBAV|Instagram|TikTok|WhatsApp/i.test(navigator.userAgent);
            
            if (!docSnap.exists()) {
                await setDoc(doc(db, 'sessions', sid), {
                    sessionId: sid,
                    enteredAt: serverTimestamp(),
                    lastActivity: serverTimestamp(),
                    browserType: inApp ? 'in-app' : 'external',
                    events: {},
                    answers: {}
                });
            } else {
                // Se o lead já existia e agora está no navegador externo, marca a saída
                if (!inApp && docSnap.data().browserType === 'in-app') {
                    await updateDoc(doc(db, 'sessions', sid), {
                        browserType: 'external',
                        exitedTikTok: true,
                        exitedAt: serverTimestamp()
                    });
                }
            }
            render();
            if (inApp && localStorage.getItem('discount_seen') !== 'true') {
                document.getElementById('discount-popup').classList.add('active');
            }
        }
        init();
    </script>
</body>
</html>
